<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOB Maroc – Offres d'emploi</title>
<meta name="description" content="Offres d'emploi au Maroc par métier, ville et secteur">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script></head>
<body><header id="hd"></header><main>
<section class="hero">
<h1 id="ht"></h1>
<form id="f"><input id="q" data-p="job">
<div class="row"><select id="c"></select><select id="s"></select></div>
<button class="btn" data-i="search"></button></form>
</section>
<h2 class="sec" id="rt"></h2><div class="strip" id="strip"></div>
<h2 class="sec" data-i="latest"></h2><div class="grid" id="list"></div></main>
<script>
init();opts(c,CITIES,1);opts(s,SECTORS,1);
rt.textContent=lang==='ar'?'شركات تقوم بالتوظيف':'Les entreprises qui recrutent';
let page=0;const PS=10;let total=0;
async function load(){
  let r=sb.from('jobs').select('id,title,company,city,sector,description,logo_url,created_at,contract,experience,function',{count:'exact'}).eq('status','approved').order('created_at',{ascending:false}).range(page*PS,page*PS+PS-1);
  const k=q.value.trim().replace(/[%_,()]/g,' ');
  if(k)r=r.or('title.ilike.%'+k+'%,company.ilike.%'+k+'%');
  if(c.value)r=r.eq('city',c.value);
  if(s.value)r=r.eq('sector',s.value);
  const {data,error,count}=await r;list.replaceChildren();
  total=count||0;
  ht.textContent=lang==='ar'?'اعثر على وظيفتك من بين '+total+' عرض':'Trouvez votre futur job parmi '+total+' offres';
  if(error||!data||!data.length){list.append(el('p','muted',t('none')));pager();return}
  data.forEach(j=>list.append(bigCard(j)));pager();
}
function pager(){
  let p=document.getElementById('pg');if(!p){p=el('div','pg');p.id='pg';list.after(p)}
  p.replaceChildren();const n=Math.max(1,Math.ceil(total/PS));
  const pv=el('button','btn sec',lang==='ar'?'السابق':'Précédent'),nx=el('button','btn sec',lang==='ar'?'التالي':'Suivant');
  pv.disabled=page===0;nx.disabled=page>=n-1;
  pv.onclick=()=>{page--;load();scrollTo(0,0)};nx.onclick=()=>{page++;load();scrollTo(0,0)};
  p.append(pv,el('span',null,(lang==='ar'?'صفحة ':'Page ')+(page+1)+(lang==='ar'?' من ':' sur ')+n),nx);
}

async function load() {
  list.replaceChildren();

  ht.textContent =
    lang === 'ar' ? 'جاري تحميل عروض العمل...' : 'Chargement des offres...';

  let r = sb
    .from('jobs')
    .select(
      'id,title,company,city,sector,description,logo_url,created_at,contract,experience,function',
      { count: 'exact' }
    )
    .eq('status', 'approved')
    .order('created_at', { ascending: false })
    .range(page * PS, page * PS + PS - 1);

  const k = q.value.trim().replace(/[%_,()]/g, ' ');

  if (k) {
    r = r.or(`title.ilike.%${k}%,company.ilike.%${k}%`);
  }

  if (c.value) r = r.eq('city', c.value);
  if (s.value) r = r.eq('sector', s.value);

  const { data, error, count } = await r;

  if (error) {
    console.error('JOB Maroc / Supabase:', error);

    ht.textContent =
      lang === 'ar' ? 'تعذر تحميل عروض العمل' : 'Erreur de chargement';

    list.append(
      el(
        'p',
        'msg err',
        (lang === 'ar' ? 'خطأ في قاعدة البيانات: ' : 'Erreur Supabase : ')
        + error.message
      )
    );

    const oldPager = document.getElementById('pg');
    if (oldPager) oldPager.remove();
    return;
  }

  total = count ?? 0;

  ht.textContent =
    lang === 'ar'
      ? `اعثر على وظيفتك من بين ${total} عرض`
      : `Trouvez votre futur job parmi ${total} offres`;

  if (!data || data.length === 0) {
    list.append(el('p', 'muted', t('none')));
    pager();
    return;
  }

  data.forEach(j => list.append(bigCard(j)));
  pager();
  }
